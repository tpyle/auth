name: Auto

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        # Every Go module in the repository. Keep in sync with dependabot.yml.
        module:
          - .
          - passkey
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}

  # The trunk ruleset requires a check named "Test and Lint". This job reports
  # the combined result of the per-module jobs under that name, so the ruleset
  # doesn't need to change when modules are added. It runs even when a module
  # job fails, because a skipped required check would count as passing.
  result:
    runs-on: ubuntu-latest
    name: Test and Lint
    needs: test
    if: always()
    steps:
      - name: Check all modules passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Module jobs: $RESULT"
          test "$RESULT" = "success"
