name: Auto

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Run lint
        run: go vet ./...

      - name: Run coverage
        run: go test -coverprofile=coverage.out ./...
